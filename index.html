<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>青山乐谱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap">
<style>
:root{--page:#f6f5f0;--card:#fdfcf8;--ink:#1d1d1b;--muted:#7a776e;--hair:rgba(29,29,27,.16);--red:#ed163c;--green:#33b540;--cond:"Barlow Condensed","Arial Narrow",sans-serif;--sans:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
body{background:var(--page);color:var(--ink);font-family:var(--sans)}
main{max-width:520px;margin:0 auto;padding:48px 22px 60px;position:relative}
.k{font-family:var(--cond);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-size:44px;margin:8px 0 4px;letter-spacing:.06em}
.sub{font-family:var(--cond);font-size:19px;color:var(--red);margin:0 0 30px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1.5px solid var(--ink);padding:20px 20px 18px;margin-bottom:22px;box-shadow:6px 6px 0 var(--plate);transform:rotate(var(--tilt))}
a.card:active{transform:translate(4px,4px) rotate(var(--tilt));box-shadow:2px 2px 0 var(--plate)}
a.card b{display:block;font-size:20px;margin-bottom:6px}
a.card span{display:block;font-size:14px;color:var(--muted);line-height:1.7}
a.card em{display:block;margin-top:10px;font-style:normal;font-family:var(--cond);letter-spacing:.18em;font-size:14px;color:var(--muted)}
.disc{position:absolute;right:18px;top:26px;width:86px;height:86px;border-radius:50%;background:var(--red)}
.disc:after{content:"";position:absolute;left:-26px;top:38px;width:52px;height:52px;border-radius:50%;background:var(--green);mix-blend-mode:multiply}
p.n{font-size:12px;color:var(--muted);line-height:1.7}
</style>
</head><body><main>
<div class="disc" aria-hidden="true"></div>
<p class="k">A Sound Guide to Qingshan Village</p>
<h1>青山乐谱</h1>
<p class="sub">Qingshan Musical Score · 线上版测试</p>
<a class="card" href="app/" style="--plate:var(--red);--tilt:-.8deg"><b>界面原型</b><span>介绍、扫描、识别出的乐谱、我的声音记录、海报、扫码后的收听页。识别还没接上，用的是示例数据。</span><em>PROTOTYPE →</em></a>
<a class="card" href="lab/" style="--plate:var(--green);--tilt:.7deg"><b>声音试验台</b><span>扫描方式、量化、节拍、音色、风声、贝斯，几个开关自由组合着听，挑出最合适的一种。</span><em>SOUND LAB →</em></a>
<p class="n">测试版本，内容会随时更新。</p>
</main></body></html>
